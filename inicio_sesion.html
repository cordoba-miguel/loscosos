<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
</head>
<body style="background-color: #F0F2E9;">
    <div style="width: 350px; margin: 100px auto; background-color: white; padding: 25px; border-radius: 12px;">
        <h1 style="text-align: center; background-color: #556B2F; color: white; padding: 15px; border-radius: 8px;">Inicio de sesión</h1>
        <p style="text-align: center;">Ingresa con el correo y la contraseña de tu cuenta.</p>

        <form method="post"> 
        <label for="correo electronico"  style="color: #000000; font-weight: bold; font-size: 15px;"> correo electronico</label> <br> <br>
        <input type="email"  id="correo" name="correo" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #C5CEB5; border-radius: 6px; outline: none;"> <br> <br>
        <label for="contraseña"  style="color: #000000; font-weight: bold; font-size: 15px;">ingrese su contraseña</label> <br> <br>
        <input type="password" id="contrasena" name="contrasena" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #C5CEB5; border-radius: 6px; outline: none;">
          <br><br>

        <button type="submit" style="background-color: #556B2F; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; ">Iniciar sesion</button>
        </form>

    </div>
    
</body>
</html>
